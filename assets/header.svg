<title id="t">ishita-pal</title>
<desc id="d">A Python REPL loads ish-codes-magic/ishita-pal with transformers. Checkpoint shards: DESY, CERN, IISER Pune, Coriolis, Hashkraft. ishita.generate("What do you do?") returns: 'Founding Engineer &amp; AI Lead @ Storefox.ai. I build LLM pipelines that turn noisy real-world audio into insight, obsess over evals, and care a lot about making AI safe and reliable.'</desc>
