name: Latest Medium posts

# Rewrites the list between the BLOG-POST-LIST markers in README.md
# with my five newest Medium articles. Commits only when something changed.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@ishta.pal"
          max_post_count: 5
